<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡単な電卓</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: 320px;
      padding: 20px;
      background: #222;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .display {
      width: 100%;
      height: 80px;
      margin-bottom: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 36px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      background: #444;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #ff9500;
    }

    .clear {
      background: #777;
    }

    .equals {
      background: #2196f3;
      grid-column: span 2;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <input
      id="display"
      class="display"
      type="text"
      value="0"
      readonly
      aria-label="計算結果"
    >

    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">AC</button>
      <button class="clear" onclick="deleteLast()">⌫</button>
      <button class="operator" onclick="chooseOperator('%')">%</button>
      <button class="operator" onclick="chooseOperator('÷')">÷</button>

      <button onclick="inputNumber('7')">7</button>
      <button onclick="inputNumber('8')">8</button>
      <button onclick="inputNumber('9')">9</button>
      <button class="operator" onclick="chooseOperator('×')">×</button>

      <button onclick="inputNumber('4')">4</button>
      <button onclick="inputNumber('5')">5</button>
      <button onclick="inputNumber('6')">6</button>
      <button class="operator" onclick="chooseOperator('-')">−</button>

      <button onclick="inputNumber('1')">1</button>
      <button onclick="inputNumber('2')">2</button>
      <button onclick="inputNumber('3')">3</button>
      <button class="operator" onclick="chooseOperator('+')">+</button>

      <button class="zero" onclick="inputNumber('0')">0</button>
      <button onclick="inputDecimal()">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById("display");

    let firstNumber = null;
    let operator = null;
    let waitingForSecondNumber = false;

    function inputNumber(number) {
      if (display.value === "Error" || waitingForSecondNumber) {
        display.value = number;
        waitingForSecondNumber = false;
        return;
      }

      if (display.value === "0") {
        display.value = number;
      } else {
        display.value += number;
      }
    }

    function inputDecimal() {
      if (display.value === "Error" || waitingForSecondNumber) {
        display.value = "0.";
        waitingForSecondNumber = false;
        return;
      }

      if (!display.value.includes(".")) {
        display.value += ".";
      }
    }

    function chooseOperator(selectedOperator) {
      const currentNumber = parseFloat(display.value);

      if (display.value === "Error") {
        clearDisplay();
        return;
      }

      if (selectedOperator === "%") {
        display.value = String(currentNumber / 100);
        return;
      }

      if (operator !== null && !waitingForSecondNumber) {
        calculate();
      }

      firstNumber = parseFloat(display.value);
      operator = selectedOperator;
      waitingForSecondNumber = true;
    }

    function calculate() {
      if (operator === null || firstNumber === null) {
        return;
      }

      const secondNumber = parseFloat(display.value);
      let result;

      switch (operator) {
        case "+":
          result = firstNumber + secondNumber;
          break;
        case "-":
          result = firstNumber - secondNumber;
          break;
        case "×":
          result = firstNumber * secondNumber;
          break;
        case "÷":
          if (secondNumber === 0) {
            display.value = "Error";
            firstNumber = null;
            operator = null;
            waitingForSecondNumber = false;
            return;
          }
          result = firstNumber / secondNumber;
          break;
        default:
          return;
      }

      display.value = formatNumber(result);
      firstNumber = null;
      operator = null;
      waitingForSecondNumber = false;
    }

    function formatNumber(number) {
      if (!Number.isFinite(number)) {
        return "Error";
      }

      return String(parseFloat(number.toFixed(10)));
    }

    function clearDisplay() {
      display.value = "0";
      firstNumber = null;
      operator = null;
      waitingForSecondNumber = false;
    }

    function deleteLast() {
      if (display.value === "Error" || waitingForSecondNumber) {
        display.value = "0";
        waitingForSecondNumber = false;
        return;
      }

      if (display.value.length <= 1) {
        display.value = "0";
      } else {
        display.value = display.value.slice(0, -1);
      }
    }
  </script>
</body>
</html>
